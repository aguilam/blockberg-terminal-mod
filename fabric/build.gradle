plugins {
	id 'com.gradleup.shadow'
	id 'maven-publish'
}

architectury {
    platformSetupLoomIde()
    fabric()
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentFabric.extendsFrom common

    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = "$project.archives_name-fabric"
}

repositories {
    maven {
        name = 'Xander Maven'
        url = 'https://maven.isxander.dev/releases'
    }
	maven {
        name = "Modrinth"
        url = "https://api.modrinth.com/maven"
    }
    mavenCentral()
}

dependencies {
	api "net.fabricmc:fabric-loader:${project.fabric_loader_version}"
	api "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
	implementation  "dev.isxander:yet-another-config-lib:${project.yacl_version}-fabric"
    compileOnly("maven.modrinth:modmenu:${project.modmenu_version}") { transitive = false }
	implementation 'com.google.code.gson:gson:2.10'
    common(project(path: ':common')) { transitive = false }
    shadowBundle project(path: ':common', configuration: 'transformProductionFabric')
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	from("LICENSE") {
		rename { "${it}_${project.base.archivesName.get()}"}
	}
}


processResources {
    def replaceProperties = [
        version: project.version,
        minecraft_version: rootProject.minecraft_version,
        fabric_loader_version: rootProject.fabric_loader_version,
        yacl_version: rootProject.yacl_version
    ]
    inputs.properties(replaceProperties)

    filesMatching('fabric.mod.json') {
        expand(replaceProperties)
    }
}

shadowJar {
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = null
}
assemble.dependsOn shadowJar